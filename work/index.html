<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work — UNHIDE</title>
<meta name="description" content="언하이드 작업 — 광고, 캐릭터, 디지털 이미징, SNS 콘텐츠, 앱.">
<link rel="icon" href="../assets/logo/favicon.png">
<link rel="stylesheet" href="../assets/site.css">
<style>
body{background:#0c0c0c;color:#f2f2f2}
:root{--sub:#8b8b8b}
.top{position:fixed;inset:0 0 auto;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:28px var(--pad);background:linear-gradient(180deg,rgba(12,12,12,.95),rgba(12,12,12,0))}
.top .logo img{height:34px;width:auto}
.top nav{display:flex;gap:26px;font-size:14px}
.top nav a{color:rgba(255,255,255,.7);transition:color .2s}.top nav a:hover,.top nav a.on{color:#fff}
.head{padding:170px var(--pad) 0}
.head .lbl{color:var(--sub)}
.head h1{font-size:clamp(40px,6vw,92px);font-weight:500;letter-spacing:-.04em;line-height:1;margin:14px 0 40px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:0 var(--pad);margin-bottom:48px}
.tabs a{font-size:13px;padding:8px 16px;border:1px solid #2c2c2c;border-radius:999px;color:#a5a5a5;transition:all .2s}
.tabs a:hover{color:#fff;border-color:#555}
.tabs a.on{background:#f2f2f2;color:#111;border-color:#f2f2f2}
.tabs a span{opacity:.55;margin-left:6px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:56px 24px;padding:0 var(--pad) 140px}
.item .im{position:relative;aspect-ratio:16/9;overflow:hidden;background:#1a1a1a}
.item .im img,.item .im video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item .im img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.item .im video{opacity:0;transition:opacity .5s}
.item:hover .im video.on{opacity:1}
.item:hover .im img{transform:scale(1.03)}
.item .im.app{background:#e9e9e7;display:flex;align-items:center;justify-content:center}
.item .im.app img{position:static;width:76%;height:auto;border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.item h3{font-size:17px;font-weight:500;margin-top:16px;letter-spacing:-.01em}
.item p{font-size:13px;color:var(--sub);margin-top:4px}
.empty{grid-column:1/-1;border-top:1px solid #262626;padding-top:28px;color:var(--sub);font-size:14px}
.ft{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:0 var(--pad) 30px;font-size:12px;color:#5f5f5f}
.ft .mail{color:#7a7a7a}.ft .mail:hover{color:#bdbdbd}
@media (max-width:900px){.grid{grid-template-columns:1fr}.top nav{gap:16px;font-size:13px}.top .logo img{height:26px}.head{padding-top:120px}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../"><img src="../assets/logo/unhide-light.png" alt="UNHIDE 언하이드"></a>
  <nav><a href="../#latest-1">Latest</a><a href="./" id="nav-work">Work</a><a href="./?c=apps" id="nav-apps">Apps</a><a href="../#menu">Contact</a></nav>
</header>

<div class="head"><span class="lbl">Work</span><h1 id="title">All Projects</h1></div>
<nav class="tabs" id="tabs"></nav>
<main class="grid" id="grid"></main>
<footer class="ft"><span>© 2026 unhide. All rights reserved.</span><a class="mail" href="mailto:phyudesign@unhide.co.kr">phyudesign@unhide.co.kr</a></footer>

<script src="../assets/works.js"></script>
<script>
const c = new URLSearchParams(location.search).get('c') || 'all';
const cat = CATEGORIES.find((x) => x.id === c);
document.getElementById('title').textContent = cat ? cat.name : 'All Projects';
document.getElementById(c === 'apps' ? 'nav-apps' : 'nav-work').classList.add('on');
const count = (id) => id === 'apps' ? APPS.length : id === 'all' ? WORKS.length : WORKS.filter((w) => w.cat === id).length;
document.getElementById('tabs').innerHTML = [{ id: 'all', name: 'All' }, ...CATEGORIES].map((x) =>
  `<a href="${x.id === 'all' ? './' : './?c=' + x.id}" class="${x.id === c ? 'on' : ''}">${x.name}<span>${count(x.id)}</span></a>`).join('');
const grid = document.getElementById('grid');
if (c === 'apps') {
  grid.innerHTML = APPS.map((a) => `<a class="item" href="../${a.href}"><div class="im app"><img src="../${a.img}" alt=""></div><h3>${a.title}</h3><p>${a.meta} · 자세히 보기 →</p></a>`).join('');
} else {
  const list = c === 'all' ? WORKS : WORKS.filter((w) => w.cat === c);
  grid.innerHTML = list.length ? list.map((w) => `<div class="item"><div class="im"><img src="../assets/hero/${w.key}.jpg" alt=""><video muted playsinline loop preload="none" data-src="../assets/hero/${w.key}.mp4"></video></div><h3>${w.title}</h3><p>${w.meta}</p></div>`).join('')
    : '<p class="empty">새 작업을 준비하고 있어요.</p>';
}
// 마우스를 올리면 소리 없이 미리보기
grid.querySelectorAll('.item').forEach((it) => {
  const v = it.querySelector('video'); if (!v) return;
  it.addEventListener('mouseenter', () => { if (!v.src) v.src = v.dataset.src; v.muted = true; v.play().then(() => v.classList.add('on')).catch(() => {}); });
  it.addEventListener('mouseleave', () => v.pause());
});
</script>
</body>
</html>
