<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNHIDE — 언하이드</title>
<meta name="description" content="언하이드는 광고, 캐릭터 디자인, 디지털 이미징, SNS 콘텐츠를 만드는 서울의 크리에이티브 스튜디오입니다.">
<link rel="icon" href="assets/logo/favicon.png">
<link rel="stylesheet" href="assets/site.css">
<style>
html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
body{background:#0c0c0c;color:#f2f2f2}
:root{--sub:#8b8b8b}
/* 고정 상단: 로고 + 메뉴 (배경 띠 없음, 밝은 화면에서도 보이도록 difference) */
.top{position:fixed;inset:0 0 auto;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:28px var(--pad);mix-blend-mode:difference;pointer-events:none}
.top a{pointer-events:auto}
.top .logo img{height:34px;width:auto}
.top nav{display:flex;gap:26px;font-size:14px}
.top nav a{color:rgba(255,255,255,.8);transition:color .2s}.top nav a:hover{color:#fff}

/* 한 화면 = 한 콘텐츠 */
.pn{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always;background:#0c0c0c}

/* ── 첫 화면 쇼릴 ── */
.hero{background:#000}
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.hero .slide.on{opacity:1}
.hero .slide img,.hero .slide video{width:100%;height:100%;object-fit:cover;opacity:.5;transform:scale(1.06);transition:transform 7s linear}
.hero .slide.on img,.hero .slide.on video{transform:scale(1)}
.hero::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.hero::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%),linear-gradient(180deg,rgba(0,0,0,.25) 0,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 75%,rgba(0,0,0,.35) 100%)}
.cap{position:absolute;left:var(--pad);right:var(--pad);bottom:34px;z-index:5;display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:rgba(255,255,255,.85)}
.cap b{display:block;font-weight:600;color:#fff;font-size:14px}
.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ctl .row2{display:flex;align-items:center;gap:10px}
.ctl .num{font-variant-numeric:tabular-nums;letter-spacing:.06em;min-width:56px;text-align:center}
.ctl button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:rgba(255,255,255,.75);transition:color .2s,background-color .2s}
.ctl button:hover{color:#fff;background:rgba(255,255,255,.12)}
.ctl button:focus-visible{outline:1px solid #fff;outline-offset:2px}
.ctl svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.5;fill:none}
/* 재생바: 숫자 아래 짧고 얇게 */
.bar{width:132px;height:11px;display:flex;align-items:center;cursor:pointer}
.bar i{position:relative;display:block;width:100%;height:1px;background:rgba(255,255,255,.25);transition:height .2s}
.bar i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff}
.bar:hover i{height:2px}

/* ── 작업 화면 ── */
/* 작업 화면: 왼쪽 설명 + 오른쪽 작은 영상 */
.work .split{position:absolute;inset:0;padding:110px var(--pad) 90px;display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;align-items:center}
.work .txt{grid-column:1/5;align-self:center}
.work .txt .lbl{display:block;font-size:12px;color:var(--sub);margin-bottom:18px;letter-spacing:.02em}
.work .txt h2{font-size:clamp(26px,2.8vw,42px);font-weight:500;letter-spacing:-.03em;line-height:1.15}
.work .txt .meta{font-size:13px;color:var(--sub);margin-top:10px}
.work .txt .desc{font-size:14px;line-height:1.75;color:#a9a9a9;margin-top:28px;max-width:380px}
.work .txt .more{display:inline-block;margin-top:30px;font-size:13px;color:#d8d8d8;border-bottom:1px solid #555;padding-bottom:2px}
.work .txt .more:hover{color:#fff;border-color:#fff}
.work .media{grid-column:6/13;position:relative;aspect-ratio:16/9;overflow:hidden;background:#161616}
.work .media img,.work .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.work .media video{opacity:0;transition:opacity .8s}
.work .media video.on{opacity:1}
.work .pn-n{position:absolute;right:var(--pad);bottom:36px;font-size:12px;color:#6a6a6a;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.work .txt,.work .media{opacity:0;transform:translateY(20px);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}
.work .media{transition-delay:.15s}
.pn.in .txt,.pn.in .media{opacity:1;transform:none}
/* 아래로 스크롤 안내 */
.cue{position:absolute;left:50%;bottom:28px;z-index:5;transform:translateX(-50%);width:1px;height:46px;background:rgba(255,255,255,.3);overflow:hidden;pointer-events:none}
.cue::after{content:"";position:absolute;left:0;top:-46px;width:1px;height:46px;background:#fff;animation:cue 2.2s ease-in-out infinite}
@keyframes cue{to{top:46px}}

/* ── 카테고리 메뉴 ── */
.menu .in-wrap{position:absolute;inset:0;padding:0 var(--pad);display:flex;flex-direction:column;justify-content:center}
.menu .lbl{color:var(--sub);margin-bottom:22px}
.cats a{display:grid;grid-template-columns:1fr auto auto;align-items:baseline;gap:24px;border-top:1px solid #262626;padding:18px 0;transition:color .25s}
.cats a:last-child{border-bottom:1px solid #262626}
.cats .t{font-size:clamp(28px,3.8vw,56px);font-weight:500;letter-spacing:-.035em;line-height:1.05;color:#bdbdbd;transition:color .25s,transform .35s}
.cats .d{font-size:13px;color:var(--sub)}
.cats .c{font-size:12px;color:#5f5f5f;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.cats a:hover .t{color:#fff;transform:translateX(8px)}
.menu .ft{position:absolute;left:0;right:0;bottom:0;padding:0 var(--pad) 30px;font-size:12px;color:#5f5f5f}
.menu .ft .motto{font-size:13px;color:#8e8e8e;letter-spacing:.01em;margin-bottom:14px}
.menu .ft .fr{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid #222;padding-top:14px}
.menu .ft .mail{color:#7a7a7a;transition:color .2s}.menu .ft .mail:hover{color:#bdbdbd}

@media (max-width:900px){
  .top nav{gap:16px;font-size:13px}.top .logo img{height:26px}
  .work .split{grid-template-columns:1fr;align-content:center;row-gap:28px;padding:96px var(--pad) 70px}
  .work .txt,.work .media{grid-column:1/-1}.work .media{order:-1}
  .work .txt .desc{margin-top:16px}.work .txt .more{margin-top:18px}
  .cue{display:none}
  .cats a{grid-template-columns:1fr auto;padding:14px 0}.cats .d{display:none}
  .menu .ft .fr{flex-direction:column;gap:6px}
  .bar{width:96px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.work .txt,.work .media{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="#top"><img src="assets/logo/unhide-light.png" alt="UNHIDE 언하이드"></a>
  <nav><a href="#latest-1">Latest</a><a href="work/">Work</a><a href="work/?c=apps">Apps</a><a href="#menu">Contact</a></nav>
</header>

<!-- 01 첫 화면 쇼릴 — 아래 SLIDES 목록에서 관리 -->
<section class="pn hero" id="top">
  <div id="slides"></div>
  <div class="cap"><div id="cap-t"></div>
    <div class="ctl">
      <div class="row2">
        <button type="button" id="prev" aria-label="이전 영상"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
        <span class="num" id="cap-n"></span>
        <button type="button" id="next" aria-label="다음 영상"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      </div>
      <div class="bar" id="bar" aria-hidden="true"><i><b id="bar-f"></b></i></div>
    </div>
  </div>
  <div class="cue" aria-hidden="true"></div>
</section>

<div id="latest"></div>

<section class="pn menu" id="menu">
  <div class="in-wrap">
    <span class="lbl">Categories</span>
    <nav class="cats" id="cats"></nav>
  </div>
  <footer class="ft">
    <p class="motto">We — Find what matters. Share what stirs hearts. Make life beautifully visible — unhide</p>
    <div class="fr"><span>© 2026 unhide. All rights reserved.</span><a class="mail" href="mailto:phyudesign@unhide.co.kr">phyudesign@unhide.co.kr</a></div>
  </footer>
</section>

<script src="assets/works.js"></script>
<script>
// 첫 화면 슬라이드: 영상(.mp4) 또는 이미지. 영상은 항상 소리 없이, 끝까지 재생된 뒤 다음으로 넘어갑니다.
const SLIDES = [
  { src: "assets/hero/starbucks.mp4",   poster: "assets/hero/starbucks.jpg",   title: "Starbucks RTD",             meta: "TVC · 30s" },
  { src: "assets/hero/callaway-60.mp4", poster: "assets/hero/callaway-60.jpg", title: "Callaway TourBan",          meta: "TVC · 60s" },
  { src: "assets/hero/dole.mp4",        poster: "assets/hero/dole.jpg",        title: "Dole Banana",               meta: "TVC · 15s" },
  { src: "assets/hero/callaway-20.mp4", poster: "assets/hero/callaway-20.jpg", title: "Callaway PARADYME TEASER",  meta: "TVC · 15s" },
  { src: "assets/hero/hidie.mp4",       poster: "assets/hero/hidie.jpg",       title: "HIDIE TEASER",              meta: "FILM · 10s" },
];
// 접속할 때마다 순서를 무작위로 섞고, 지난 방문 때 첫 화면이었던 영상은 첫 순서에서 피함
for (let k = SLIDES.length - 1; k > 0; k--) { const r = Math.floor(Math.random() * (k + 1)); [SLIDES[k], SLIDES[r]] = [SLIDES[r], SLIDES[k]]; }
try {
  const last = localStorage.getItem('unhide_hero_first');
  if (SLIDES.length > 1 && SLIDES[0].src === last) SLIDES.push(SLIDES.shift());
  localStorage.setItem('unhide_hero_first', SLIDES[0].src);
} catch (e) { /* 저장 불가 환경이면 그냥 무작위 */ }
const IMAGE_SECONDS = 6;
const box = document.getElementById('slides'), capT = document.getElementById('cap-t'), capN = document.getElementById('cap-n');
const isVid = (s) => /\.mp4$/i.test(s.src);
const els = SLIDES.map((s) => {
  const d = document.createElement('div'); d.className = 'slide';
  if (isVid(s)) {
    const v = document.createElement('video');
    v.muted = true; v.defaultMuted = true; v.volume = 0; v.playsInline = true; v.preload = 'none';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.poster = s.poster || '';
    v.addEventListener('volumechange', () => { v.muted = true; v.volume = 0; });   // 소리 강제 차단
    v.addEventListener('ended', () => go(1));
    d.appendChild(v);
  } else d.innerHTML = `<img src="${s.src}" alt="">`;
  box.appendChild(d); return d;
});
const load = (k) => { const v = els[k].querySelector('video'); if (v && !v.src) { v.src = SLIDES[k].src; v.preload = 'auto'; } };
let i = -1, timer = 0, imgStart = 0;
function go(step = 1) {
  clearTimeout(timer);
  if (i >= 0) {
    const old = els[i]; old.classList.remove('on');
    const pv = old.querySelector('video'); if (pv) setTimeout(() => { if (!old.classList.contains('on')) pv.pause(); }, 1400);
  }
  i = (i + step + els.length) % els.length; els[i].classList.add('on');
  const v = els[i].querySelector('video');
  if (v) { load(i); v.currentTime = 0; v.play().catch(() => {}); timer = setTimeout(() => go(1), 90000); }  // 혹시 멈춰도 다음으로
  else { imgStart = performance.now(); timer = setTimeout(() => go(1), IMAGE_SECONDS * 1000); }
  load((i + 1) % els.length); load((i - 1 + els.length) % els.length);   // 앞뒤 영상 미리 불러오기
  capT.innerHTML = `<b>${SLIDES[i].title}</b>${SLIDES[i].meta}`;
  capN.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(els.length).padStart(2, '0');
}
go(1);
document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));
document.addEventListener('keydown', (e) => {
  if (window.scrollY > innerHeight * .5 || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1);
});
// 재생바
const bar = document.getElementById('bar'), fill = document.getElementById('bar-f');
(function tick() {
  const v = els[i].querySelector('video');
  let p = 0;
  if (v) p = v.duration ? v.currentTime / v.duration : 0;
  else p = Math.min(1, (performance.now() - imgStart) / (IMAGE_SECONDS * 1000));
  fill.style.width = (p * 100).toFixed(2) + '%';
  requestAnimationFrame(tick);
})();
bar.addEventListener('click', (e) => {
  const v = els[i].querySelector('video'); if (!v || !v.duration) return;
  const r = bar.getBoundingClientRect(); v.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * v.duration;
});

// 최신 작업 3개
const TOTAL = 3;
document.getElementById('latest').innerHTML = WORKS.slice(0, TOTAL).map((w, k) => `
<section class="pn work"${k === 0 ? ' id="latest-1"' : ''}>
  <div class="split">
    <div class="txt">
      <span class="lbl">Latest Work — ${(CATEGORIES.find((c) => c.id === w.cat) || {}).name || ''}</span>
      <h2>${w.title}</h2><p class="meta">${w.meta}</p>
      ${w.desc ? `<p class="desc">${w.desc}</p>` : ''}
      <a class="more" href="work/?c=${w.cat}">See More</a>
    </div>
    <div class="media"><img src="assets/hero/${w.key}.jpg" alt=""><video muted playsinline loop preload="none" data-src="assets/hero/${w.key}.mp4"></video></div>
  </div>
  <span class="pn-n">${String(k + 1).padStart(2, '0')} / ${String(TOTAL).padStart(2, '0')}</span>
</section>`).join('');
// 카테고리 메뉴
document.getElementById('cats').innerHTML = CATEGORIES.map((c) => {
  const n = c.id === 'apps' ? APPS.length : WORKS.filter((w) => w.cat === c.id).length;
  return `<a href="${c.href || 'work/?c=' + c.id}"><span class="t">${c.name}</span><span class="d">${c.ko}</span><span class="c">${String(n).padStart(2, '0')}</span></a>`;
}).join('');
// 작업 화면: 화면에 들어오면 소리 없이 재생, 벗어나면 정지
const io = new IntersectionObserver((ents) => ents.forEach((en) => {
  const pn = en.target, v = pn.querySelector('.media video');
  if (en.isIntersecting) {
    pn.classList.add('in');
    if (v) { if (!v.src) v.src = v.dataset.src; v.muted = true; v.play().then(() => v.classList.add('on')).catch(() => {}); }
  } else { pn.classList.remove('in'); if (v) v.pause(); }
}), { threshold: .55 });
document.querySelectorAll('.pn:not(.hero)').forEach((p) => io.observe(p));
// 첫 화면을 벗어나면 쇼릴 정지, 돌아오면 다시 재생
new IntersectionObserver(([en]) => {
  const v = els[i] && els[i].querySelector('video'); if (!v) return;
  en.isIntersecting ? v.play().catch(() => {}) : v.pause();
}, { threshold: .3 }).observe(document.getElementById('top'));
</script>
</body>
</html>
